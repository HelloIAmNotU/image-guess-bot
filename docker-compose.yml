services:
  bot:
    build: ./bot
    env_file:
      - .env
    depends_on:
      - db
    restart: always
    networks:
      - app-net

  db:
    build:
      context: .
      dockerfile: Database/Dockerfile
    env_file: .env
    restart: always
    networks:
      - app-net

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge
